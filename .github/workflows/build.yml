name: Build executables

# Génère les exécutables Windows (.exe NSIS), macOS (.dmg) et Linux (.AppImage).
# Déclenché manuellement ou sur un tag de version (v1.2.3).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Génère le client Prisma + les moteurs déclarés dans binaryTargets.
      # Pas besoin d'une vraie base : seul le client/les moteurs sont produits.
      - name: Prisma generate
        run: npx prisma generate

      # Compile (preload + main + renderer) puis empaquette pour la cible.
      - name: Build & package
        run: npm run package:${{ matrix.target }}
        env:
          # Évite que electron-builder tente de publier automatiquement.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: afrikimmo-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.blockmap
          if-no-files-found: ignore
